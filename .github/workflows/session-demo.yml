name: Session keys demo, live in the group

# Runs the session-keys story on Robinhood Chain testnet and posts it to the
# community group with every transaction hash: a throwaway owner hands a bot
# a bounded key, the bot buys through the real Uniswap router, is refused
# outside its rules, gets its key pulled, and the owner takes everything back.
# See scripts/session-demo-live.ts.
#
# Secrets, under Settings > Secrets and variables > Actions:
#   DEMO_PRIVATE_KEY     a fresh throwaway key funded with about 0.05 test
#                        ETH. Never the operator's key. Any wallet can make
#                        one; the address only ever holds test ETH.
#   TELEGRAM_BOT_TOKEN   the group's bot (same as the push announcer)
#   TELEGRAM_CHAT_ID     the group
# Without the Telegram pair the story is printed and the job passes. Without
# the demo key the job fails and says so.
#
# The SessionAccountFactory on 46630 is recorded (deployments/fleet-46630.json,
# app/session-target.json). Nothing here commits to main: a run that would
# change either record fails and says so, and the record is committed by hand
# through a reviewed change.

on:
  workflow_dispatch:
  schedule:
    # Sundays at noon UTC: a weekly reminder that the thing works, with fresh hashes.
    - cron: '0 12 * * 0'

permissions:
  contents: read

concurrency:
  group: session-demo
  cancel-in-progress: false

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npx hardhat compile
      - run: npm run build

      - name: Run the demo and tell the group
        env:
          DEMO_PRIVATE_KEY: ${{ secrets.DEMO_PRIVATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node dist/scripts/session-demo-live.js

      # The factory is recorded; a demo that moved the record is a change to
      # review, not one for a robot to push to main.
      - name: Refuse a moved factory record
        run: |
          if git diff --quiet -- deployments/fleet-46630.json app/session-target.json; then
            echo "the factory record is unchanged"
            exit 0
          fi
          echo "::error::the demo changed deployments/fleet-46630.json or app/session-target.json; commit the record through a reviewed change"
          git --no-pager diff -- deployments/fleet-46630.json app/session-target.json
          exit 1
