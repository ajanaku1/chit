name: Sweep the pool

# Starts the scheduled sweep on chit.tools every four hours. This is the sweep
# that queues owed charges in one batch, posts what is due and funds fleets
# whose wait is over; its cadence bounds how long a charge can wait before it
# is queued (see PROGRESS.md's neighbour, IMPLEMENTATION.md "Operator
# hardening"). It lives here because Vercel's Hobby plan runs a cron at most
# once a day; the two daily crons in vercel.json stay as a fallback.
#
# This is the queueing clock, and it does not tick faster for safety's sake:
# how often it runs is the size of the batch a charge hides in. Beating the
# pool's POST_WINDOW is the posting clock's job: /api/fleet/sweep-posting,
# every two hours from vercel.json, posts and funds and never queues.
# test/fleet/sweep-timing.test.ts holds both.
#
# One repository secret, optional: FLEET_CRON_SECRET, the same value as
# CRON_SECRET on Vercel. With it set on both sides, only this workflow and
# Vercel's own crons can start a sweep. Without it the endpoint is open.

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The service's own host, not the site. chit.tools serves the site and forwards
      # /api/* to the service, which is right for a browser and wrong for this: a
      # forwarded request is one more thing that can drop a header, and the first
      # scheduled sweep after the hosts were split was refused 401 with no way to
      # tell, from outside, whether the secret or the forward was at fault. The
      # variable is set per environment, so moving the service moves this with it.
      - name: Start the sweep
        id: sweep
        env:
          FLEET_CRON_SECRET: ${{ secrets.FLEET_CRON_SECRET }}
          SERVICE: ${{ vars.FLEET_SERVICE_ORIGIN || 'https://testnet.chit.tools' }}
        run: |
          echo "sweeping $SERVICE"
          if [ -n "$FLEET_CRON_SECRET" ]; then
            curl -fsS --max-time 240 -H "Authorization: Bearer $FLEET_CRON_SECRET" "$SERVICE/api/fleet/sweep"
          else
            curl -fsS --max-time 240 "$SERVICE/api/fleet/sweep"
          fi

      # A sweep that never started is the half of T049 the service cannot
      # report: it reports its own failures, but nothing inside it runs when
      # the function is unreachable, times out or answers 5xx. Four hours,
      # because the charges this sweep did not queue still have their deadline
      # and the next tick may well get them (FR-023). The operator chat only,
      # never the group; without the two secrets the red run is the alert.
      - name: Say so in the operator chat
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MONITOR_CHAT_ID: ${{ secrets.MONITOR_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$MONITOR_CHAT_ID" ]; then
            echo "not sent: TELEGRAM_BOT_TOKEN and MONITOR_CHAT_ID are not both set"
            exit 0
          fi
          TEXT="Chit fleet service · alert · the scheduled sweep
          4H sweep-unreachable (operations): the four-hourly sweep did not start; /api/fleet/sweep did not answer
              $RUN_URL"
          # No --max-time here: the smallest one in this file is how long the
          # sweep is given (test/fleet/sweep-timing.test.ts reads it), and a
          # smaller number on this call would read as less patience for the
          # sweep itself. The job's five minutes bound this one.
          curl -fsS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -H 'content-type: application/json' \
            --data "$(jq -nc --arg chat "$MONITOR_CHAT_ID" --arg text "$TEXT" '{chat_id: $chat, text: $text, disable_web_page_preview: true}')"
