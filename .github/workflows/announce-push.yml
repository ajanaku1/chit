name: Announce pushes to Telegram

# Every push to main is posted to the community group: what shipped, told in
# the group's voice from the commits and any new dev diary entry in
# IMPLEMENTATION.md, then any new address or transaction recorded under
# deployments/ with explorer links. See scripts/announce-push.mjs.
#
# Repository secrets, set once under Settings > Secrets and variables >
# Actions:
#   TELEGRAM_BOT_TOKEN   a bot that is a member of the group (BotFather makes
#                        one; add it to the group and let it post)
#   TELEGRAM_CHAT_ID     the group's @username for a public group, or its
#                        numeric id (negative for supergroups)
#   ANTHROPIC_API_KEY    optional: with it the post is written in the group's
#                        voice by Claude from the push's facts; without it the
#                        commits go out grouped as new / fixed / tests, with
#                        the diary entry as written
# Without the Telegram pair the job prints what it would have sent and passes.

on:
  push:
    branches: [main]
  # Run by hand once after setting the secrets: the bot says hello in the
  # group, which proves the token and the chat id before the first push. With
  # a range given, it announces that range instead: for a push it missed.
  workflow_dispatch:
    inputs:
      before:
        description: 'Announce commits after this ref (exclusive); leave empty to just say hello'
        required: false
      after:
        description: 'Up to this ref (inclusive); defaults to main'
        required: false
        default: 'main'

permissions:
  contents: read

concurrency:
  group: announce-push
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      # Full history: the diary and chain messages diff the tree before and
      # after the push, and `before` can be many commits back.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Only the Anthropic SDK, into a folder of its own: the repository's tree
      # (hardhat, playwright) is not needed to post a message. The checkout has
      # no node_modules, so a link there is what the script's import resolves.
      - name: Fetch the Anthropic SDK
        run: |
          npm install --prefix "$RUNNER_TEMP/sdk" --no-audit --no-fund --no-package-lock @anthropic-ai/sdk
          ln -s "$RUNNER_TEMP/sdk/node_modules" node_modules

      - name: Post the push
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANNOUNCE_BEFORE: ${{ inputs.before }}
          ANNOUNCE_AFTER: ${{ inputs.after }}
        run: node scripts/announce-push.mjs
