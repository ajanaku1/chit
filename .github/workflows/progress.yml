name: Publish build progress

# Every push to main recomputes landing/public/progress.json from the task
# checkboxes in specs/*/tasks.md and the stage table in README.md, and commits
# it if the facts changed. The landing's "Launch app" sheet reads that file, so
# what visitors see about how far along Chit is follows the repo, not memory.
# The rule is PROGRESS.md; the script is scripts/progress.mjs.

on:
  push:
    branches: [main]
    paths-ignore:
      - landing/public/progress.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: progress
  cancel-in-progress: true

jobs:
  progress:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Full history: the commit count is one of the published facts.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Recompute progress.json, if the facts moved
        run: |
          # --check ignores the timestamp and commit fields, so an unchanged
          # task list produces no commit.
          if node scripts/progress.mjs --check; then exit 0; fi
          node scripts/progress.mjs
          git add landing/public/progress.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # [skip ci] keeps this commit from re-running the announcer for a
          # change no reader needs to hear about.
          git commit -m "chore(progress): recompute build progress from the task lists [skip ci]"
          git push
